syntax = "proto3";

package ruoyu.study.mistake.common.v1;

option csharp_namespace = "Ruoyu.Study.Mistake.Contract.Protos";

// 通用响应
message BoolResponse {
  bool success = 1;
  string error_message = 2;
}

// ID请求
message IdRequest {
  string id = 1;
}

// 字符串请求
message StringRequest {
  string value = 1;
}

// 分页请求
message PageRequest {
  int32 page = 1;
  int32 size = 2;
}

// 分页响应元数据
message PageMeta {
  int32 total_page = 1;
  int32 total_count = 2;
  int32 current_page = 3;
  int32 page_size = 4;
}

// 错题类型
enum MistakeType {
  UNKNOWN = 0;
  CARELESS = 1;        // 马虎型
  KNOWLEDGE_GAP = 2;   // 知识点未掌握
  COMPREHENSION = 3;   // 文意未掌握
}

// 处理动作
enum ProcessAction {
  VIEWED = 0;
  ANALYZED = 1;
  TAGGED_KNOWLEDGE = 2;
  EXTRACTED_VOCAB = 3;
  REVIEWED = 4;
}
