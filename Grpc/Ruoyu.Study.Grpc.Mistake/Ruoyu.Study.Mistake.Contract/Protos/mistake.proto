syntax = "proto3";

package ruoyu.study.mistake.v1;

import "Protos/mistake.common.proto";

option csharp_namespace = "Ruoyu.Study.Mistake.Contract.Protos";

// 错题分析服务 - 错题处理、生词提取、教材关联
service MistakeAnalysisGrpcService {
  
  // ========== 错题录入与管理 ==========
  rpc AddMistake(AddMistakeRequest) returns (MistakeDto);
  rpc UpdateMistake(UpdateMistakeRequest) returns (BoolResponse);
  rpc DeleteMistake(IdRequest) returns (BoolResponse);
  rpc GetMistake(GetMistakeRequest) returns (MistakeDto);
  rpc GetMistakeList(GetMistakeListRequest) returns (MistakePageResult);
  
  // ========== 错题分析 ==========
  rpc AnalyzeMistakeType(AnalyzeMistakeRequest) returns (MistakeTypeResponse);
  rpc GetMistakeKnowledges(IdRequest) returns (KnowledgeListResponse);
  rpc LogMistakeProcess(LogMistakeProcessRequest) returns (BoolResponse);
  rpc GetMistakeProcessHistory(IdRequest) returns (ProcessLogListResponse);
  
  // ========== 生词提取 ==========
  rpc ExtractVocabulary(ExtractVocabularyRequest) returns (ExtractVocabularyResponse);
  rpc FilterKnownWords(FilterKnownWordsRequest) returns (WordListResponse);
  rpc FindSourceSentence(FindSourceSentenceRequest) returns (SourceSentenceResponse);
  rpc ImportExtractedWords(ImportExtractedWordsRequest) returns (ImportWordsResponse);
  
  // ========== 教材知识关联 ==========
  rpc GetKnowledgeByWord(GetKnowledgeByWordRequest) returns (KnowledgeListResponse);
  rpc GetExampleSentences(GetExampleSentencesRequest) returns (SentenceListResponse);
  rpc GetWordUsageInfo(GetWordUsageInfoRequest) returns (WordUsageInfoResponse);
}

// ========== 错题相关 ==========
message AddMistakeRequest {
  string student_id = 1;
  int32 subject = 2;
  int32 grade = 3;
  bytes image = 4;
  string content = 5;
  string correct_answer = 6;
  string student_answer = 7;
  string comments = 8;
}

message UpdateMistakeRequest {
  string mistake_id = 1;
  string content = 2;
  string correct_answer = 3;
  string student_answer = 4;
  string comments = 5;
}

message GetMistakeRequest {
  string mistake_id = 1;
  string student_id = 2;
}

message GetMistakeListRequest {
  string student_id = 1;
  int32 subject = 2;
  int32 grade = 3;
  MistakeType type = 4;
  int32 page = 5;
  int32 size = 6;
}

message AnalyzeMistakeRequest {
  string mistake_id = 1;
  string content = 2;
  string correct_answer = 3;
  string student_answer = 4;
}

message MistakeTypeResponse {
  MistakeType type = 1;
  string type_name = 2;
  string analysis_reason = 3;
}

message LogMistakeProcessRequest {
  string mistake_id = 1;
  string student_id = 2;
  ProcessAction action = 3;
  string details = 4;
}

message MistakeDto {
  string id = 1;
  string student_id = 2;
  int32 subject = 3;
  int32 grade = 4;
  string date = 5;
  bytes thumb = 6;
  string content = 7;
  string correct_answer = 8;
  string student_answer = 9;
  MistakeType type = 10;
  string library_id = 11;
  string comments = 12;
  bool is_archived = 13;
}

message MistakePageResult {
  repeated MistakeDto items = 1;
  PageMeta page_meta = 2;
}

// ========== 生词提取相关 ==========
message ExtractVocabularyRequest {
  string mistake_id = 1;
  string content = 2;
  int32 student_grade = 3;
}

message ExtractVocabularyResponse {
  repeated ExtractedWord words = 1;
  int32 total_found = 2;
}

message ExtractedWord {
  string word = 1;
  string part_of_speech = 2;
  string meaning = 3;
  int32 frequency = 4;
  double confidence = 5;
}

message FilterKnownWordsRequest {
  string student_id = 1;
  repeated ExtractedWord candidates = 2;
}

message WordListResponse {
  repeated ExtractedWord words = 1;
}

message FindSourceSentenceRequest {
  string word = 1;
  int32 grade = 2;
  int32 subject = 3;
  int32 max_results = 4;
}

message SourceSentenceResponse {
  repeated SourceSentence sentences = 1;
}

message SourceSentence {
  string sentence = 1;
  string source = 2;
  string context = 3;
}

message ImportExtractedWordsRequest {
  string student_id = 1;
  string mistake_id = 2;
  repeated ExtractedWord words = 3;
  string book_id = 4;
}

message ImportWordsResponse {
  int32 imported_count = 1;
  repeated string failed_words = 2;
}

// ========== 教材知识相关 ==========
message GetKnowledgeByWordRequest {
  string word = 1;
  int32 grade = 2;
  int32 subject = 3;
}

message GetExampleSentencesRequest {
  string word = 1;
  int32 grade = 2;
  int32 subject = 3;
  int32 count = 4;
}

message SentenceListResponse {
  repeated string sentences = 1;
}

message GetWordUsageInfoRequest {
  string word = 1;
  int32 grade = 2;
  int32 subject = 3;
}

message WordUsageInfoResponse {
  string word = 1;
  repeated string common_pos = 2;
  repeated string collocations = 3;
  repeated string exam_points = 4;
}

message KnowledgeListResponse {
  repeated KnowledgeDto knowledges = 1;
}

message KnowledgeDto {
  string id = 1;
  string name = 2;
  string description = 3;
  int32 subject = 4;
  int32 grade = 5;
}

message ProcessLogListResponse {
  repeated ProcessLogDto logs = 1;
}

message ProcessLogDto {
  string id = 1;
  string mistake_id = 2;
  ProcessAction action = 3;
  string details = 4;
  string created_at = 5;
}
