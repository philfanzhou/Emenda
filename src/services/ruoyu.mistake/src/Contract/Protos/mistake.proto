syntax = "proto3";

package ruoyu.study.mistake.v1;

import "Protos/mistake.common.proto";

option csharp_namespace = "Ruoyu.Study.Mistake.Contract.Protos";

service MistakeGrpcService {
  rpc SubmitMistakeUpload(SubmitMistakeUploadRequest) returns (SubmitMistakeUploadResponse);

  rpc GetMistakeItem(IdRequest) returns (MistakeItemDto);
  rpc GetMistakeItemsByUpload(GetMistakeItemsByUploadRequest) returns (MistakeItemListResponse);
  rpc GetMistakeItemList(GetMistakeItemListRequest) returns (MistakeItemPageResult);
  rpc GetPendingReviewUploads(GetPendingReviewUploadsRequest) returns (PendingReviewUploadListResponse);

  rpc ReviewMistakeItem(ReviewMistakeItemRequest) returns (ReviewMistakeItemResponse);
  rpc ReanalyzeMistakeItem(ReanalyzeMistakeItemRequest) returns (ReanalyzeMistakeItemResponse);
  rpc GetReanalyzeJobs(GetReanalyzeJobsRequest) returns (GetReanalyzeJobsResponse);
  rpc GetActiveReanalyzeJobs(GetActiveReanalyzeJobsRequest) returns (GetActiveReanalyzeJobsResponse);
  rpc AddMistakeItem(AddMistakeItemRequest) returns (MistakeItemDto);
  rpc UpdateMistakeItem(UpdateMistakeItemRequest) returns (MistakeItemDto);
  rpc DeleteMistakeItem(IdRequest) returns (BoolResponse);
  rpc CompleteUploadReview(CompleteUploadReviewRequest) returns (CompleteUploadReviewResponse);

  rpc AddMistakePractice(AddMistakePracticeRequest) returns (MistakePracticeDto);
  rpc GetMistakePractices(IdRequest) returns (MistakePracticeListResponse);

  rpc LogMistakeProcess(LogMistakeProcessRequest) returns (BoolResponse);
  rpc GetMistakeProcessHistory(IdRequest) returns (ProcessLogListResponse);

  // OSS 代理接口（供 BFF 层调用，避免 BFF 直接持有 OSS 凭证）
  rpc GetPresignedUrl(GetPresignedUrlRequest) returns (PresignedUrlResponse);
}

message SubmitMistakeUploadRequest {
  string student_id = 1;
  int32 subject = 2;
  int32 grade = 3;
  repeated string image_paths = 4;
  string root_cause = 5;
  string source_upload_id = 6;
}

message SubmitMistakeUploadResponse {
  bool success = 1;
  string error_message = 2;
  repeated string created_item_ids = 3;
}

message GetMistakeItemsByUploadRequest {
  string source_upload_id = 1;
}

message MistakeItemListResponse {
  repeated MistakeItemDto items = 1;
}

message GetMistakeItemListRequest {
  string student_id = 1;
  int32 subject = 2;
  int32 grade = 3;
  ReviewStatus review_status = 4;
  int32 page = 5;
  int32 size = 6;
}

message MistakeItemPageResult {
  repeated MistakeItemDto items = 1;
  PageMeta page_meta = 2;
}

message GetPendingReviewUploadsRequest {
  int32 page = 1;
  int32 size = 2;
  repeated int32 subjects = 3;
}

message PendingReviewUploadListResponse {
  repeated PendingReviewUploadDto uploads = 1;
  PageMeta page_meta = 2;
}

message ReviewMistakeItemRequest {
  string id = 1;
  ReviewStatus review_status = 2;
  string reviewer_id = 3;
  string root_cause = 4;
  int32 grade = 5;
  int32 subject = 6;
  string return_reason = 7; // 教师退回原因（仅 Rejected 时使用，透传给 student 服务写入 return_reason 字段）
}

message ReviewMistakeItemResponse {
  bool success = 1;
  string error_message = 2;
  string source_upload_id = 3;
  string student_id = 4;
  repeated string removed_image_paths = 5;
}

message ReanalyzeMistakeItemRequest {
  string id = 1;
  string reviewer_id = 2;            // 教师 ID（BFF 从 JWT 提取）
  string teacher_description = 3;     // 可选：教师补充描述
  string student_id = 4;              // 学生 ID（必填，鉴权校验用）
}

message ReanalyzeMistakeItemResponse {
  bool success = 1;
  string error_message = 2;
  // 旧字段 item 已废弃：Job 异步执行，结果通过 GetReanalyzeJobs 查询。
  reserved 3;
  string job_id = 4;                  // 成功时返回 JobId
}

message ReanalyzeJobDto {
  string job_id = 1;
  string item_id = 2;
  string student_id = 3;
  ReanalyzeJobStatus status = 4;
  string new_root_cause = 5;
  string error_message = 6;
  string created_at = 7;
  string started_at = 8;
  string completed_at = 9;
  int64 vl_duration_ms = 10;
}

message GetReanalyzeJobsRequest {
  string reviewer_id = 1;             // 教师 ID（BFF 从 JWT 提取，必填，鉴权用）
  repeated string job_ids = 2;         // 1-100 个
}

message GetReanalyzeJobsResponse {
  bool success = 1;
  string error_message = 2;
  repeated ReanalyzeJobDto jobs = 3;
}

message GetActiveReanalyzeJobsRequest {
  string reviewer_id = 1;             // 教师 ID（BFF 从 JWT 提取，必填，鉴权用）
}

message GetActiveReanalyzeJobsResponse {
  bool success = 1;
  string error_message = 2;
  repeated ReanalyzeJobDto jobs = 3;
}

message AddMistakeItemRequest {
  string student_id = 1;
  int32 subject = 2;
  int32 grade = 3;
  string source_upload_id = 4;
  repeated SourceRegion source_regions = 5;
  string root_cause = 6;
}

message UpdateMistakeItemRequest {
  string id = 1;
  string student_id = 2;
  int32 subject = 3;
  int32 grade = 4;
  repeated SourceRegion source_regions = 5;
}

message CompleteUploadReviewRequest {
  string source_upload_id = 1;
  string reviewer_id = 2;
}

message CompleteUploadReviewResponse {
  bool success = 1;
  string error_message = 2;
  string student_id = 3;
  repeated string removed_image_paths = 4;  // 需要从上传记录中移除的图片路径
}
message AddMistakePracticeRequest {
  string mistake_item_id = 1;
  string student_id = 2;
  repeated string image_paths = 3;
  string student_answer = 4;
  bool is_correct = 5;
  string comments = 6;
}

message MistakePracticeListResponse {
  repeated MistakePracticeDto practices = 1;
}

message LogMistakeProcessRequest {
  string mistake_item_id = 1;
  string student_id = 2;
  ProcessAction action = 3;
  string details = 4;
}

message ProcessLogListResponse {
  repeated ProcessLogDto logs = 1;
}

// ========== OSS Proxy Messages ==========

message GetPresignedUrlRequest {
  string object_path = 1;
  int32 expiry_seconds = 2;  // 默认 3600
  string size = 3;           // full/small/thumbnail/medium
}

message PresignedUrlResponse {
  string url = 1;
  int32 expiry_seconds = 2;
}
