syntax = "proto3";

package ruoyu.study.mistake.v1;

import "Protos/mistake.common.proto";

option csharp_namespace = "Ruoyu.Study.Mistake.Contract.Protos";

// ========== 错题本服务 ==========
service MistakeGrpcService {
  // === 错题管理 ===
  rpc UploadMistake(UploadMistakeRequest) returns (UploadMistakeResponse);  // 学生上传错题
  rpc UpdateMistake(UpdateMistakeRequest) returns (BoolResponse); // 教师/系统完善错题
  rpc DeleteMistake(IdRequest) returns (BoolResponse); // 删除错题（仅PENDING状态）
  rpc DeleteMistakeImage(DeleteMistakeImageRequest) returns (BoolResponse); // 删除错题中的单张图片（仅PENDING状态）
  rpc GetMistake(GetMistakeRequest) returns (GetMistakeResponse);
  rpc GetMistakeList(GetMistakeListRequest) returns (MistakePageResult);
  rpc MarkMistakeProcessed(MarkMistakeProcessedRequest) returns (BoolResponse); // 教师/系统标记为已处理
  rpc SplitMistake(SplitMistakeRequest) returns (BoolResponse); // 将一个错题拆分为多个新错题

  // === 错题重答与举一反三 ===
  rpc AddMistakePractice(AddMistakePracticeRequest) returns (MistakePracticeDto);
  rpc GetMistakePractices(IdRequest) returns (MistakePracticeListResponse);

  // === 错题分析 ===
  rpc AnalyzeMistakeType(AnalyzeMistakeRequest) returns (MistakeTypeResponse);
  rpc LogMistakeProcess(LogMistakeProcessRequest) returns (BoolResponse);
  rpc GetMistakeProcessHistory(IdRequest) returns (ProcessLogListResponse);

  // === 图片去重 ===
  rpc CheckImagesExist(CheckImagesExistRequest) returns (CheckImagesExistResponse);
}

// ========== 错题请求 ==========
message UploadMistakeRequest {
  string student_id = 1;
  int32 subject = 2;
  int32 grade = 3;
  int32 type = 4;
  repeated bytes images = 5;   // 错题原图
  string comments = 6;
  string question_id = 7;      // 若已知，关联题库
}

message UploadMistakeResponse {
  bool success = 1;
  MistakeDto mistake = 2;
  MistakeDetailDto detail = 3;
  repeated DuplicateImageInfo duplicates = 4;
}

message GetMistakeResponse {
  MistakeDto mistake = 1;
  MistakeDetailDto detail = 2;
}

message MarkMistakeProcessedRequest {
  string id = 1;
  string question_id = 2;
}

message UpdateMistakeRequest {
  string mistake_id = 1;
  string comments = 2;
  repeated bytes images = 3;
  string question_id = 4;
  int32 subject = 5;
  int32 grade = 6;
  int32 type = 7;
}

message SplitMistakeRequest {
  string original_mistake_id = 1;
  repeated SplitMistakeItem new_mistakes = 2;
}

message SplitMistakeItem {
  string student_id = 1;
  int32 subject = 2;
  int32 grade = 3;
  int32 type = 4;
  repeated bytes images = 5;
  string comments = 6;
}

message DeleteMistakeImageRequest {
  string mistake_id = 1;
  string image_path = 2;
}

message GetMistakeRequest {
  string mistake_id = 1;
  string student_id = 2;
}

message GetMistakeListRequest {
  string student_id = 1;
  int32 subject = 2;
  int32 grade = 3;
  int32 type = 4;
  int32 page = 5;
  int32 size = 6;
  string start_date = 7;
  string end_date = 8;
  MistakeStatus status = 9;
}

// ========== 重答请求 ==========
message AddMistakePracticeRequest {
  string mistake_id = 1;
  string student_id = 2;
  repeated bytes images = 3;
  string student_answer = 4;
  bool is_correct = 5;
  string comments = 6;
}

message MistakePracticeListResponse {
  repeated MistakePracticeDto practices = 1;
}

// ========== 分析请求 ==========
message AnalyzeMistakeRequest {
  string mistake_id = 1;
  string content = 2;
  string correct_answer = 3;
  string student_answer = 4;
}

message MistakeTypeResponse {
  int32 type = 1;
  string type_name = 2;
  string analysis_reason = 3;
}

message LogMistakeProcessRequest {
  string mistake_id = 1;
  string student_id = 2;
  ProcessAction action = 3;
  string details = 4;
}

message ProcessLogListResponse {
  repeated ProcessLogDto logs = 1;
}

// ========== 图片去重请求 ==========
message CheckImagesExistRequest {
  string student_id = 1;
  repeated string image_hashes = 2;
}

message CheckImagesExistResponse {
  repeated ImageExistenceResult results = 1;
}
