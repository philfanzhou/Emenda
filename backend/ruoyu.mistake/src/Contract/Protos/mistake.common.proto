syntax = "proto3";

package ruoyu.study.mistake.v1;

option csharp_namespace = "Ruoyu.Study.Mistake.Contract.Protos";

enum ReviewStatus {
  REVIEW_STATUS_UNSPECIFIED = 0;
  REVIEW_STATUS_PENDING_REVIEW = 1;
  REVIEW_STATUS_CONFIRMED = 2;
  REVIEW_STATUS_REJECTED = 3;
}

enum ProcessAction {
  PROCESS_ACTION_UNSPECIFIED = 0;
  PROCESS_ACTION_CREATED = 1;
  PROCESS_ACTION_ANALYZED = 2;
  PROCESS_ACTION_REVIEW_CONFIRMED = 3;
  PROCESS_ACTION_REVIEW_REJECTED = 4;
  PROCESS_ACTION_PRACTICED = 5;
  PROCESS_ACTION_MASTERED = 6;
}

message IdRequest {
  string id = 1;
}

message BoolResponse {
  bool success = 1;
  optional string error_message = 2;
}

message PageMeta {
  int32 page = 1;
  int32 size = 2;
  int32 total_count = 3;
  int32 total_pages = 4;
}

message BoundingBox {
  int32 x1 = 1;
  int32 y1 = 2;
  int32 x2 = 3;
  int32 y2 = 4;
}

message SourceRegion {
  string source_image_path = 1;
  BoundingBox bounding_box = 2;
}

message MistakeItemDto {
  string id = 1;
  string student_id = 2;
  int32 subject = 3;
  int32 grade = 4;
  string source_upload_id = 5;
  repeated SourceRegion source_regions = 6;
  ReviewStatus review_status = 7;
  string reviewer_id = 8;
  string reviewed_at = 9;
  string review_comment = 10;
  int32 type = 11;
  string question_id = 12;
  string created_at = 13;
  string updated_at = 14;
}

message MistakePracticeDto {
  string id = 1;
  string mistake_item_id = 2;
  string student_id = 3;
  string practice_date = 4;
  repeated string image_paths = 5;
  string student_answer = 6;
  bool is_correct = 7;
  string comments = 8;
}

message ProcessLogDto {
  string id = 1;
  string mistake_item_id = 2;
  ProcessAction action = 3;
  string details = 4;
  string created_at = 5;
}

message PendingReviewUploadDto {
  string source_upload_id = 1;
  string student_id = 2;
  int32 subject = 3;
  int32 grade = 4;
  int32 pending_count = 5;
  int32 total_count = 6;
  string earliest_created_at = 7;
}

message Empty {}

message GetAllReferencedImagePathsResponse {
  repeated string image_paths = 1;
}
