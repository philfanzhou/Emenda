name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore src/Emenda.sln

      - name: Build
        run: dotnet build src/Emenda.sln --configuration Release --no-restore

      - name: Domain tests
        run: >-
          dotnet test
          src/Tests/Emenda.Domain.Tests/Emenda.Domain.Tests.csproj
          --configuration Release --no-build

      # The database-backed suites are gated by MISTAKE_*_TEST_CONNECTION
      # variables and each needs its own disposable PostgreSQL 15 container;
      # CI runs the independent tests and the release rehearsal covers the
      # database-backed suites with a dedicated environment.
      - name: Service tests without PostgreSQL
        run: >-
          dotnet test
          src/Tests/Emenda.Service.Tests/Emenda.Service.Tests.csproj
          --configuration Release --no-build
          --filter "FullyQualifiedName!~PostgresTests"

  container-build:
    name: Container image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds the release image exactly as release.yml does, without pushing,
      # so a broken Dockerfile fails the pull request instead of a release.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/Host/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: emenda:ci
          build-args: |
            APP_VERSION=0.0.0-ci.${{ github.run_id }}
            APP_REVISION=${{ github.sha }}
            APP_CHANNEL=ci
          cache-from: type=gha,scope=emenda-release